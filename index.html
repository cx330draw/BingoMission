<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>賓果特務｜西部懸賞榜</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Microsoft JhengHei',sans-serif;color:#402516;background:#98683f url('background.png') center/cover fixed no-repeat}button{cursor:pointer;font-family:inherit} .layout{max-width:1920px;margin:auto;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) clamp(170px,16vw,265px);gap:clamp(4px,.8vw,16px);padding:clamp(4px,.8vw,14px);overflow:hidden}.board{min-width:0;min-height:0;background:transparent url('wanted_board.png') center/100% 100% no-repeat;padding:clamp(12px,3vh,32px) 4%;display:flex;flex-direction:column;justify-content:center;filter:drop-shadow(0 10px 12px #29140680)}.progress{text-align:center;font-weight:900;color:#fff0d3;text-shadow:2px 2px 3px #301809;margin:0 0 12px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(2px,.4vh,7px);width:min(100%,calc((100dvh - 95px)*1.1));max-width:1150px;margin:0 auto}.mission{position:relative;aspect-ratio:10/11;background:transparent;border:0;padding:0;cursor:pointer;min-width:0;transition:transform .15s}.mission:hover{transform:scale(1.035);z-index:1}.mission img.paper{display:block;width:100%;height:100%;object-fit:contain}.mission img.stamp{position:absolute;left:50%;top:50%;width:78%;height:78%;object-fit:contain;transform:translate(-50%,-50%) rotate(-12deg);pointer-events:none;filter:drop-shadow(0 2px 1px #671b1888)}.mission.line{filter:drop-shadow(0 0 5px #ffdd53)}.sidebar{display:flex;flex-direction:column;gap:clamp(3px,.7vh,10px);min-height:0}.difficulty{display:flex;flex-direction:column;gap:4px;align-items:center}.difficulty h2{margin:0;color:#fff2c8;text-shadow:2px 2px #3b2114}.choices{display:flex;flex-direction:column;gap:clamp(2px,.5vh,6px);width:100%;align-items:center}.choices button{width:min(100%,150px);height:clamp(48px,10vh,100px);background:transparent center/contain no-repeat;border:0;font-size:0}.choices button.active{filter:brightness(1.2) drop-shadow(0 0 6px #ffeb6b)}.stats{background:#f4ddb8e8;border:4px solid #8b532f;border-radius:10px;padding:clamp(4px,.7vh,10px);text-align:center;font-weight:bold}.stats p{margin:6px 0}.stats b{color:#8d251b}.calculator{margin-top:auto;background:#f3d4a3 url('calculator.png') center/100% 100% no-repeat;padding:clamp(8px,1.5vh,22px) 12px;border-radius:8px;text-align:center;filter:drop-shadow(0 7px 7px #29140780)}.calculator h2{margin:0 0 5px;font-size:clamp(14px,1.6vw,20px)}.remaining{font-size:clamp(20px,2.5vw,32px);font-weight:900;color:#a72a20;overflow-wrap:anywhere}.small{font-size:13px;line-height:1.6}.entry{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;align-items:center;gap:5px;margin-top:10px}.entry input{width:100%;min-width:0;border:2px solid #8a5c3c;border-radius:7px;padding:12px 5px;font-size:19px;text-align:center;background:#fff9e8}.image-btn{height:58px;width:58px;background:transparent center/contain no-repeat;border:0}.image-btn:active{transform:scale(.94)}#boom{background-image:url('btn_boom.png')}#add{background-image:url('btn_add.png')}.input-label{font-weight:900;margin-top:6px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#16110f7a;z-index:20;padding:16px}.overlay.show{display:flex}.dialog{background:rgba(218,218,218,.75);border:2px solid #eee;border-radius:16px;box-shadow:0 15px 45px #1e18188a;backdrop-filter:blur(7px);width:min(450px,100%);padding:28px;text-align:center;color:#2b2623}.dialog h2{margin:0 0 14px;font-size:29px}.dialog p{font-weight:800}.dialog button{border:2px solid #745038;background:#f9e6c7;border-radius:9px;padding:12px 18px;font-size:18px;font-weight:900;margin:5px}.dialog .comp-options{display:flex;justify-content:center;flex-wrap:wrap}.beers{font-size:72px;animation:cheers 1.1s ease-in-out infinite alternate;display:inline-block;transform-origin:bottom center}@keyframes cheers{0%{transform:rotate(-15deg) scale(.9)}100%{transform:rotate(12deg) scale(1.1)}}@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr) 190px;gap:5px;padding:6px}.board{padding:12% 3% 8%}.choices button{width:120px;height:78px}.entry{grid-template-columns:42px minmax(0,1fr) 42px}.image-btn{width:42px;height:42px}.calculator{padding:15px 7px}.remaining{font-size:23px}.stats{font-size:12px;padding:6px}.difficulty h2{font-size:18px}}@media(max-width:580px){.layout{grid-template-columns:minmax(0,1fr) 145px}.board{padding:4% 2%}.sidebar{gap:3px}.choices{display:flex;flex-direction:column}.choices button{width:100%;height:clamp(38px,9vh,70px)}.stats{display:block;padding:3px;font-size:10px}.calculator{margin-top:auto;padding:6px 3px}.calculator .small{font-size:10px}.calculator h2{font-size:13px}.remaining{font-size:19px}.progress{font-size:13px}.entry{grid-template-columns:30px minmax(0,1fr) 30px;gap:2px}.image-btn{width:30px;height:30px}.entry input{padding:5px 1px;font-size:13px}}
/* 懸賞榜：維持原圖 10:12（5:6），絕不拉伸 */
html,body{height:100%;overflow:hidden}
.layout{grid-template-columns:minmax(0,1fr) clamp(175px,17vw,265px);height:100dvh;align-items:center}
.board{
 position:relative;left:100px;
 width:auto;height:min(96dvh, calc((100vw - clamp(175px,17vw,265px) - 155px) * 1.2));
 max-width:100%;aspect-ratio:5 / 6;
 min-width:0;min-height:0;flex:none;
 padding:0;justify-self:center;align-self:center;
 background-color:transparent!important;
 background-image:url('wanted_board.png');
 background-position:center;background-repeat:no-repeat;background-size:contain;
 filter:drop-shadow(0 10px 12px #29140680);
}
/* 5×5 懸賞單獨立疊在木板上，不會改變木板長寬比 */
.board .grid{
 position:absolute;top:13%;left:11%;width:78%;height:auto;
 display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
 grid-template-rows:repeat(5,auto);gap:0 5px;
 max-width:none;max-height:none;min-height:0;
 margin:0;padding:0;align-content:start;
 transform:translateY(50px);
}
.board .grid .mission{display:block;position:relative;width:100%;height:auto;aspect-ratio:1 / 1;min-width:0;min-height:0;margin:0;padding:0;border:0;background:transparent;overflow:visible}
.board .grid .mission img.paper{display:block;width:100%;height:100%;object-fit:contain}
.board .grid .mission img.stamp{opacity:.75}
/* 難度選擇 */
.difficulty{gap:0}
.difficulty h2{font-weight:900;letter-spacing:1px;text-align:center;color:#fff2c8;-webkit-text-stroke:1px #45210e;text-shadow:2px 2px 0 #45210e,-1px -1px 0 #45210e,1px -1px 0 #45210e,-1px 1px 0 #45210e}
.difficulty .choices{gap:0}
.difficulty .choices button{height:clamp(40px,7.4vh,70px);flex-shrink:0}
.calculator{background-color:rgba(243,212,163,.75)}
.calculator .remaining,.calculator .small{background:rgba(255,248,226,.75);border-radius:6px}
@media(max-width:900px){.board{left:0;height:min(96dvh,calc((100vw - 205px) * 1.2))}}
@media(max-width:580px){.board{height:min(96dvh,calc((100vw - 155px) * 1.2))}.board .grid{transform:translateY(20px)}.difficulty .choices button{height:clamp(32px,7vh,56px)}}

/* 右側操作區：靠齊視窗右緣，整體約兩倍尺寸 */
.layout{
  max-width:none;
  width:100%;
  grid-template-columns:minmax(0,1fr) clamp(320px,28vw,530px);
  gap:8px;
  padding:8px 0 8px 8px;
}
.sidebar{
  width:100%;
  justify-self:end;
  align-self:stretch;
  padding:0;
  gap:clamp(4px,.8vh,10px);
}
.difficulty h2{font-size:clamp(24px,2.4vw,38px);line-height:1.2}
.difficulty .choices{width:100%;gap:0}
.difficulty .choices button{
  width:min(100%,300px);
  height:clamp(76px,11vh,140px);
  flex-shrink:1;
}
.stats{font-size:clamp(16px,1.5vw,25px);padding:8px 12px;border-width:4px}
.stats p{margin:3px 0}
.calculator{
  width:100%;
  margin-top:auto;
  padding:clamp(12px,1.7vh,26px) clamp(12px,1.6vw,28px);
  border-radius:12px;
}
.calculator h2{font-size:clamp(22px,2vw,36px);margin-bottom:10px}
.calculator .remaining{font-size:clamp(36px,3.1vw,60px)}
.calculator .small{font-size:clamp(17px,1.45vw,26px);line-height:1.45}
.calculator .input-label{font-size:clamp(18px,1.5vw,28px);margin-top:8px}
.calculator .entry{grid-template-columns:clamp(64px,5vw,100px) minmax(0,1fr) clamp(64px,5vw,100px);gap:8px;margin-top:8px}
.calculator .image-btn{width:100%;height:clamp(64px,5vw,100px)}
.calculator .entry input{font-size:clamp(20px,1.8vw,32px);padding:12px 4px}
.board{
  left:0;
  height:min(96dvh, calc((100vw - clamp(320px,28vw,530px) - 28px) * 1.2));
}
@media(max-height:800px){
  .difficulty .choices button{height:clamp(54px,9vh,85px)}
  .calculator{padding:8px 12px}
  .calculator h2{font-size:24px;margin-bottom:3px}
  .calculator .remaining{font-size:38px}
  .calculator .small{font-size:17px;line-height:1.25}
  .calculator .input-label{font-size:18px;margin-top:3px}
  .calculator .entry{grid-template-columns:62px minmax(0,1fr) 62px;margin-top:4px}
  .calculator .image-btn{height:62px}
  .calculator .entry input{font-size:21px;padding:8px 2px}
  .stats{font-size:16px;padding:3px}
}
@media(max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) clamp(200px,36vw,320px)}
  .board{left:0;height:min(96dvh, calc((100vw - clamp(200px,36vw,320px) - 20px) * 1.2))}
  .difficulty h2{font-size:22px}
  .difficulty .choices button{width:min(100%,240px);height:clamp(48px,9vh,90px)}
  .calculator h2{font-size:20px}
  .calculator .remaining{font-size:30px}
  .calculator .small{font-size:14px}
  .calculator .input-label{font-size:15px}
  .calculator .entry{grid-template-columns:45px minmax(0,1fr) 45px;gap:3px}
  .calculator .image-btn{height:45px}
  .calculator .entry input{font-size:16px;padding:8px 2px}
}
@media(max-width:580px){
  .layout{grid-template-columns:minmax(0,1fr) 45vw}
  .board{height:min(96dvh, calc((55vw - 12px) * 1.2))}
  .difficulty .choices button{height:clamp(36px,7vh,65px)}
  .calculator{padding:6px 4px}
  .calculator .entry{grid-template-columns:32px minmax(0,1fr) 32px}
  .calculator .image-btn{height:32px}
}

/* 2026-10-09：右側難度與計算器貼齊右緣，尺寸加大 1.5 倍 */
.layout{grid-template-columns:minmax(0,1fr) clamp(390px,36vw,720px);padding-right:0;column-gap:8px}
.sidebar{justify-self:end;width:100%;margin-right:0;padding-right:0}
.difficulty{width:100%;align-items:flex-end}
.difficulty h2{width:100%;font-size:clamp(27px,3vw,54px);text-align:center}
.difficulty .choices{align-items:flex-end;width:100%;gap:0}
.difficulty .choices button{width:min(100%,450px);height:clamp(78px,12vh,150px)}
.stats{font-size:clamp(18px,1.9vw,30px)}
.calculator{width:100%;margin-left:auto;margin-right:0;padding:clamp(12px,2vh,32px) clamp(12px,2vw,36px)}
.calculator h2{font-size:clamp(24px,2.7vw,48px)}
.calculator .remaining{font-size:clamp(40px,4vw,78px)}
.calculator .small{font-size:clamp(18px,1.8vw,33px)}
.calculator .input-label{font-size:clamp(20px,2vw,36px)}
.calculator .entry{grid-template-columns:clamp(70px,6vw,125px) minmax(0,1fr) clamp(70px,6vw,125px)}
.calculator .image-btn{height:clamp(70px,6vw,125px)}
.calculator .entry input{font-size:clamp(23px,2.4vw,42px)}
.board{height:min(96dvh, calc((100vw - clamp(390px,36vw,720px) - 28px) * 1.2))}
@media(max-height:900px){
 .difficulty .choices button{height:clamp(54px,9vh,96px)}
 .difficulty h2{font-size:clamp(23px,2.5vw,40px)}
 .stats{font-size:clamp(14px,1.5vw,24px);padding:4px 8px}
 .calculator{padding:8px 12px}
 .calculator h2{font-size:clamp(20px,2.2vw,36px);margin-bottom:3px}
 .calculator .remaining{font-size:clamp(32px,3vw,56px)}
 .calculator .small{font-size:clamp(15px,1.4vw,24px);line-height:1.25}
 .calculator .input-label{font-size:clamp(16px,1.5vw,27px);margin-top:3px}
 .calculator .entry{grid-template-columns:clamp(52px,4.5vw,85px) minmax(0,1fr) clamp(52px,4.5vw,85px);margin-top:4px}
 .calculator .image-btn{height:clamp(52px,4.5vw,85px)}
 .calculator .entry input{font-size:clamp(18px,1.7vw,30px);padding:8px 2px}
}
@media(max-width:900px){
 .layout{grid-template-columns:minmax(0,1fr) clamp(230px,42vw,400px)}
 .board{height:min(96dvh, calc((100vw - clamp(230px,42vw,400px) - 20px) * 1.2))}
 .difficulty .choices button{width:min(100%,360px)}
}
@media(max-width:580px){
 .layout{grid-template-columns:minmax(0,1fr) 48vw}
 .board{height:min(96dvh, calc((52vw - 12px) * 1.2))}
 .difficulty .choices button{height:clamp(36px,7vh,65px)}
 .calculator{padding:6px 4px}
 .calculator .entry{grid-template-columns:34px minmax(0,1fr) 34px}
 .calculator .image-btn{height:34px}
}
</style></head><body>
<main class="layout"><section class="board"><div class="grid" id="grid"></div></section><aside class="sidebar"><div class="difficulty"><h2>★ 難度選擇 ★</h2><div class="choices" id="choices"></div></div><div class="stats"><p>難度：<b id="modeName"></b></p><p>連線：<b id="lines"></b></p><p>任務：<b id="count"></b></p></div><div class="calculator"><h2>💰 剩餘保底金額</h2><div class="remaining" id="remaining">3000萬</div><div class="small">初始保底：<span id="base"></span><br>炸單補償：<span id="comp"></span><br>已獲賞金：<span id="earned"></span></div><div class="input-label">輸入本局賞金（萬）</div><div class="entry"><button class="image-btn" id="boom" title="炸單補償" aria-label="炸單補償"></button><input id="amount" type="number" min="1" step="1" placeholder="例如300" aria-label="本局賞金（萬）"><button class="image-btn" id="add" title="加入賞金" aria-label="加入賞金"></button></div></div></aside></main>
<div class="overlay" id="boomOverlay"><div class="dialog"><h2>💣 炸單補償</h2><p>選擇補償金額，增加保底上限</p><div class="comp-options"><button data-comp="80">＋80萬</button><button data-comp="70">＋70萬</button><button data-comp="20">＋20萬</button></div><button id="boomClose">取消</button></div></div>
<div class="overlay" id="winOverlay"><div class="dialog"><div class="beers" aria-hidden="true">🍻</div><h2>🎉 懸賞完成！</h2><p id="winText"></p><button id="winClose">繼續查看懸賞榜</button></div></div>
<script>
const modes=[{name:'三連',need:3,base:3000,price:3300,img:'btn_3.png'},{name:'四連',need:4,base:6000,price:5800,img:'btn_4.png'},{name:'五連',need:5,base:12000,price:9900,img:'btn_5.png'},{name:'全盤',need:12,base:25000,price:18800,img:'btn_full.png',full:true}];
const patterns=[];for(let r=0;r<5;r++)patterns.push(Array.from({length:5},(_,c)=>r*5+c));for(let c=0;c<5;c++)patterns.push(Array.from({length:5},(_,r)=>r*5+c));patterns.push([0,6,12,18,24],[4,8,12,16,20]);
let mode=0,done=new Set(),earned=0,compensation=0,won=false;const $=id=>document.getElementById(id);const money=n=>n>=10000?`${Math.floor(n/10000)}億${n%10000?`${n%10000}萬`:''}`:`${n}萬`;
function render(){const m=modes[mode],finished=patterns.filter(p=>p.every(i=>done.has(i))),lineCells=new Set(finished.flat());$('choices').innerHTML=modes.map((x,i)=>`<button data-mode="${i}" class="${mode===i?'active':''}" title="${x.name} $${x.price}" aria-label="${x.name}" style="background-image:url('${x.img}')">${x.name}</button>`).join('');$('grid').innerHTML=Array.from({length:25},(_,i)=>`<button class="mission ${done.has(i)?'done':''} ${lineCells.has(i)?'line':''}" data-i="${i}" aria-label="懸賞任務${i+1}${done.has(i)?'已完成':''}" aria-pressed="${done.has(i)}"><img class="paper" src="${i+1}.png" alt="懸賞任務${i+1}" draggable="false">${done.has(i)?'<img class="stamp" src="complete.png" alt="COMPLETE">':''}</button>`).join('');$('modeName').textContent=m.name;$('lines').textContent=`${finished.length} / ${m.need}`;$('count').textContent=`${done.size} / 25`;$('base').textContent=money(m.base);$('comp').textContent=money(compensation);$('earned').textContent=money(earned);$('remaining').textContent=money(Math.max(0,m.base+compensation-earned));const success=m.full?done.size===25:finished.length>=m.need;if(success&&!won){won=true;$('winText').textContent=`${m.name}達標！剩餘保底 ${money(Math.max(0,m.base+compensation-earned))}。`;$('winOverlay').classList.add('show')}if(!success)won=false;}
$('choices').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;const next=Number(b.dataset.mode);if(next===mode)return;if((done.size||earned||compensation)&&!confirm('更換難度將清空目前懸賞進度、賞金及炸單補償，確定嗎？'))return;mode=next;done.clear();earned=0;compensation=0;won=false;render()});$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=Number(b.dataset.i);done.has(i)?done.delete(i):done.add(i);render()});function add(){const n=Number($('amount').value);if(!Number.isSafeInteger(n)||n<=0){alert('請輸入大於0的整數賞金，單位為萬');return}earned+=n;$('amount').value='';render()}$('add').onclick=add;$('amount').addEventListener('keydown',e=>{if(e.key==='Enter')add()});$('boom').onclick=()=>$('boomOverlay').classList.add('show');$('boomClose').onclick=()=>$('boomOverlay').classList.remove('show');$('boomOverlay').addEventListener('click',e=>{if(e.target===$('boomOverlay'))$('boomOverlay').classList.remove('show');const b=e.target.closest('[data-comp]');if(b){compensation+=Number(b.dataset.comp);$('boomOverlay').classList.remove('show');render()}});$('winClose').onclick=()=>$('winOverlay').classList.remove('show');render();
</script></body></html>
